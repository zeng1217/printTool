<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#1f2329"/>
    </linearGradient>
  </defs>

  <!-- macOS 规范:四周留透明边距,背景为居中内缩瓦片 (~78% 画布) -->
  <rect x="112" y="112" width="800" height="800" rx="180" ry="180" fill="url(#bg)"/>

  <g transform="translate(512 512) scale(0.9) translate(-512 -512)">
    <!-- 出纸:顶部锯齿撕口的白色小票 -->
    <path d="M368 300
             l24 -34 l24 34 l24 -34 l24 34 l24 -34 l24 34 l24 -34 l24 34
             l24 -34 l24 34 l24 -34 l24 34
             L656 588 L368 588 Z"
          fill="#ffffff"/>

    <!-- 票面:两条文字线 -->
    <rect x="412" y="372" width="200" height="20" rx="10" fill="#1f2329"/>
    <rect x="412" y="416" width="132" height="20" rx="10" fill="#1f2329"/>

    <!-- 打印机机身 -->
    <rect x="288" y="560" width="448" height="224" rx="40" fill="#ffffff"/>
  </g>
</svg>
